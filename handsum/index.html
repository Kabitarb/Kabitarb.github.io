<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HandSum – add handwritten numbers live</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  #video { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; background: #000; }
  #demoimg { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; }
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  #intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 32px; text-align: center; background: radial-gradient(circle at 50% 30%, #1d2b3a, #000 70%); }
  #intro[hidden], #demoimg[hidden], #torch[hidden] { display: none; }
  #intro h1 { margin: 0; font-size: 34px; letter-spacing: -0.5px; }
  #intro p { margin: 0; max-width: 340px; color: #c6ced8; line-height: 1.45; }
  #intro ul { margin: 0; padding-left: 18px; text-align: left; color: #c6ced8; font-size: 14px; line-height: 1.6; max-width: 340px; }
  button { font: inherit; color: #fff; border: 0; border-radius: 999px; padding: 12px 22px; background: rgba(255,255,255,0.18); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  button:disabled { opacity: 0.5; }
  button.active { background: #ff9f1c; color: #000; }
  #start { background: #39d353; color: #000; font-weight: 700; font-size: 18px; padding: 14px 32px; }
  #status { min-height: 1.4em; color: #ffb3b3; font-size: 14px; }
  .bar { position: fixed; left: 0; right: 0; display: none; justify-content: center; gap: 14px; padding: 12px; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  body.live .bar { display: flex; }
  #top { top: env(safe-area-inset-top, 0); }
  #bottom { bottom: calc(env(safe-area-inset-bottom, 0) + 10px); }
  #chip { background: rgba(0,0,0,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 999px; padding: 10px 16px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
  #chip .fps { color: rgba(255,255,255,0.5); font-size: 12px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  #debug, #torch { padding: 12px 16px; }
</style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <img id="demoimg" alt="" hidden>
  <canvas id="overlay"></canvas>

  <div id="intro">
    <h1>HandSum</h1>
    <p>Point the camera at columns of handwritten numbers. Each column's total appears under its last number, live.</p>
    <ul>
      <li>Write one number per line, columns clearly apart.</li>
      <li>Circle a number to subtract it.</li>
      <li>Decimals: a clear dot, e.g. <b>12.5</b>.</li>
    </ul>
    <button id="start">Start camera</button>
    <div id="status"></div>
  </div>

  <div class="bar" id="top"><div id="chip">Point at handwritten numbers</div></div>
  <div class="bar" id="bottom">
    <button id="torch" hidden>🔦</button>
    <button id="freeze">❚❚ Freeze</button>
    <button id="debug" title="Show what the recognizer sees">Debug</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
